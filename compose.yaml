services:
  gnomon:
    build: .
    image: ghcr.io/naomiamethyst/gnomon:latest
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    ports:
      - "5319:5319/udp"
      - "5319:5319/tcp"
    volumes:
      - ./deployment:/etc/gnomon:ro
    healthcheck:
      test: ["CMD", "/usr/bin/gnomon", "query", "--server", "127.0.0.1:5319", "--public-key", "${GNOMON_ROOT_PUBLIC_KEY:?Set the pinned root public key}", "--transport", "udp", "--attempts", "1", "--timeout-seconds", "2"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
