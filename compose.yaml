services:
  gnomon:
    build: .
    image: ghcr.io/naomiamethyst/gnomon:latest
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    ports:
      - "5319:5319/udp"
      - "5319:5319/tcp"
    # Every daemon setting is a GNOMON_<FIELD> variable; see
    # packaging/gnomon.toml.example for fields and defaults. Optional settings
    # are passed through from .env or the shell only when set.
    environment:
      - GNOMON_ROOT_PUBLIC_KEY=${GNOMON_ROOT_PUBLIC_KEY:?Set the pinned root public key}
      - GNOMON_RADIUS_SECONDS
      - GNOMON_REQUIRE_SYNCHRONIZED_CLOCK
      - GNOMON_MAX_SIGNATURES_PER_SECOND
      - GNOMON_MAX_REQUESTS_PER_SECOND_PER_SOURCE
      - GNOMON_MAX_CONNECTIONS
      - GNOMON_QUEUE_CAPACITY
      - GNOMON_IO_TIMEOUT_SECONDS
    # online.key and delegation.cert, at the default GNOMON_ONLINE_KEY and
    # GNOMON_CERTIFICATE paths.
    volumes:
      - ./deployment:/etc/gnomon:ro
    healthcheck:
      test: ["CMD", "/usr/bin/gnomon", "query", "--server", "127.0.0.1:5319", "--public-key", "${GNOMON_ROOT_PUBLIC_KEY:?Set the pinned root public key}", "--transport", "udp", "--attempts", "1", "--timeout-seconds", "2"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
