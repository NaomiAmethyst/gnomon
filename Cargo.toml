[package]
name = "gnomon"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
authors = ["Naomi Persephone Amethyst <naomi@amethyst.name>"]
license = "AGPL-3.0-only"
description = "RFC 10049 Roughtime daemon, client, and verification library"
repository = "https://github.com/NaomiAmethyst/gnomon"
readme = "README.md"
default-run = "gnomon"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
