name: CI and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: [stable, '1.85.0']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt --component clippy
      - name: Check release tag matches package version before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag must match Cargo.toml version'
          PY
      - run: cargo +${{ matrix.rust }} fmt --all --check
      - run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.rust }} test --locked --all-targets
      - run: cargo +${{ matrix.rust }} doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo +${{ matrix.rust }} build --locked --bins
      - run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - run: python3 tests/reference.py
      - run: python3 tests/systemd.py
      - name: Verify dependency license notices
        run: |
          python3 packaging/collect-licenses.py
          git diff --exit-code -- THIRD-PARTY-NOTICES
      - name: Confirm reference fixture reproducibility
        run: |
          python3 tests/reference.py --write-fixture
          git diff --exit-code -- tests/fixtures/reference-v1.json

  packages:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y musl-tools rpm python3-cryptography
      - run: rustup target add ${{ matrix.target }}
      - name: Build static binaries and record dependencies
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release --locked --bins
          mkdir -p dist
          cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' > dist/dependencies-${{ matrix.arch }}.json
          python3 packaging/build-packages.py --binaries target/${{ matrix.target }}/release --arch '${{ matrix.arch }}'
      - name: Test packaged binaries
        run: |
          mkdir extracted
          dpkg-deb -x dist/*.deb extracted
          python3 tests/reference.py --binaries extracted/usr/bin
          dpkg-deb --info dist/*.deb
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          sed "s@ExecStart=/usr/bin/gnomond@ExecStart=$PWD/extracted/usr/bin/gnomond@" extracted/usr/lib/systemd/system/gnomon.service > /tmp/gnomon.service
          systemd-analyze verify /tmp/gnomon.service
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag must match Cargo.toml version'
          PY
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  container:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local scratch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: gnomon:ci
      - run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - run: cargo build --locked --bins
      - run: python3 tests/reference.py --docker-image gnomon:ci
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64/arm64 images with SBOM and provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/naomiamethyst/gnomon:${{ github.ref_name }}
            ghcr.io/naomiamethyst/gnomon:latest
          provenance: mode=max
          sbom: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Include source and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/gnomon-source/gnomon/.cargo
          git archive HEAD | tar -x -C /tmp/gnomon-source/gnomon
          cargo vendor --locked /tmp/gnomon-source/gnomon/vendor > /tmp/gnomon-source/gnomon/.cargo/config.toml
          sed -i 's@/tmp/gnomon-source/gnomon/vendor@vendor@g' /tmp/gnomon-source/gnomon/.cargo/config.toml
          tar -czf "dist/gnomon-${RELEASE_TAG}-source.tar.gz" -C /tmp/gnomon-source gnomon
          cd dist
          sha256sum -- *.deb *.rpm *.tar.gz dependencies-*.json > SHA256SUMS
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "Gnomon $RELEASE_TAG" --notes-file docs/release-notes.md dist/*
